name: Build & Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets release.yml call this as a reusable workflow, so a release
  # re-runs the exact same build/lint/test/package gate rather than
  # duplicating those steps in a second workflow file.
  workflow_call: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build

      - run: npm run lint

      - run: npm test

      - run: npx @vscode/vsce package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
