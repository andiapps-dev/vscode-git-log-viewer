name: "CodeQL"

# Static analysis (SAST) for the extension + webview TypeScript,
# separate from build.yml's lint/test/package gate. Runs on every
# push/PR to main plus a weekly schedule so newly-published CodeQL
# queries get applied even on weeks with no commits.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
